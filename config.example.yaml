# CD-Compliance-Checks configuration (OPTIONAL template).
#
# The app runs WITHOUT a config.yaml — everything below has portable defaults, so
# a fresh clone works on any machine. Copy this to `config.yaml` only if you want
# to pin values in a file; otherwise set the data folders from the dashboard ⚙
# panel (they persist to runtime_settings.json). Relative paths resolve against
# this config file. Quote paths that contain spaces or backslashes.

paths:
  # Machine-specific data folders — best set from the dashboard ⚙ panel.
  # Windows example: 'N:\CSI\OneDrive - …\Tier 1\staging'
  # macOS example:   '/Users/you/Library/CloudStorage/OneDrive-…/Tier 1/staging'
  source_root: ''      # WT OneDrive staging (participant folders CD011, CD012, …)
  output_root: ''      # Dashboard output tree: <output_root>/<CDxxx>/<Season>/<Device>/

tools:
  # Tool repos default to SIBLINGS of this project folder — if CD-Compliance-Checks
  # lives at  <parent>/CD-Compliance-Checks,  they are cloned to  <parent>/<repo>.
  # `python setup_tools.py` clones them from the URLs below (--update to git pull).
  # Override the folders here or from the dashboard ⚙ panel if you keep them
  # elsewhere. Relative paths resolve against this config file.
  epoching_repo: '../actigraphy-epoching'
  sleep_metrics_repo: '../actigraphy-sleep-metrics'
  luminosity_repo: '../luminosity-metrics'
  # GitHub sources fetched by setup_tools.py.
  epoching_repo_url: 'https://github.com/liyang-D/actigraphy-epoching.git'
  sleep_metrics_repo_url: 'https://github.com/infernalzeus/actigraphy-sleep-metrics.git'
  luminosity_repo_url: 'https://github.com/infernalzeus/luminosity-metrics.git'
  # Interpreter used to launch both tools. Must have numpy/pandas/scipy/matplotlib
  # (and Step 2's dependencies) importable. Use a full path to pin a specific env.
  python_executable: 'python'

# Default run scope (override per run via CLI flags).
participant: 'CD011'
devices: ['actigraph']     # also implemented: mieye (light logger). Stubs: expiwell, saliva, cognitron, qualtrics
seasons: null              # null => all discovered season folders
copy_bin: true             # replicate the raw ~1.1 GB .bin into the output tree

actigraph_folder_name: 'Actigraph'
actigraph_bin_glob: '*.bin'

# MiEYE light logger. One CSV per season folder (an XLSX saved with a .csv
# extension); only that sheet is read. The luminosity-metrics tool computes the
# metrics, compliance and report — see the `luminosity:` block below.
mieye_folder_name: 'MiEYE'
mieye_input_glob: '*-logged.csv'

# Actigraph compliance — wear-validity rule (best-practice):
#   1. non-wear detection: an epoch is non-wear when >=2 of 3 axis SDs are below
#      nonwear_axis_sd_g (device motionless), sustained for nonwear_min_minutes.
#   2. valid day: >= min_valid_hours of WEAR time AND hourly-mean SVM range
#      >= min_diurnal_range_svm (rejects flat/constant days).
#   3. PASS when valid_days >= min_valid_days (REVIEW within margin, else FAIL).
# Thresholds are calibratable; the per-day wear/range table is in every report.
compliance:
  nonwear_axis_sd_g: 0.013      # ~13 mg (van Hees). Lower = stricter non-wear.
  nonwear_min_minutes: 30       # sustained stillness required for non-wear
  min_valid_hours: 10.0         # wear hours needed for a "valid day"
  min_valid_days: 3             # valid days needed to PASS
  review_margin_days: 1         # within this of the bar => REVIEW instead of FAIL
  min_diurnal_range_svm: 20.0   # min hourly-mean SVM range for a valid (worn) day
  expected_wear_hours: 16.0     # denominator for daily %compliance
  epochs_per_hour: 60           # 60-second epochs
  activity_threshold_svm: 5.0   # fallback only (SVM-only inputs, no axis SDs)
  svm_column: 'SVM_sum'
  time_column: 'Time'

# MiEYE (luminosity) compliance — valid-day rule from the LIGHT signal (the
# device is charged regularly, so the charger flag is NOT a wear signal):
#   1. diurnal variation: daytime mean melanopic >= min_day_night_ratio * night
#      mean (a real day/night rhythm; rejects flat/all-dark "in a drawer" days).
#   2. light activity: >= min_light_hours of epochs with melanopic >=
#      light_floor_lx (a full waking day is ~expected_light_hours ≈ 16 h).
#   3. PASS when valid_days >= min_valid_days (REVIEW within margin, else FAIL).
# day/night windows + TAT/TBT thresholds drive the secondary light-adequacy
# stats (mean daytime/night melanopic, minutes above 250 lx, minutes below 10 lx)
# reported alongside the verdict. All soft/calibratable (Brown et al. 2022).
luminosity:
  min_valid_days: 3              # valid days needed to PASS
  review_margin_days: 1          # within this of the bar => REVIEW instead of FAIL
  light_floor_lx: 10.0            # melanopic lx counting as light exposure
  min_light_hours: 10.0           # hours at/above the floor for a valid day
  expected_light_hours: 10.0      # daily %compliance denominator
  dark_threshold_lx: 200.0        # 'dark / rest' boundary (hourly histogram, L windows)
  min_day_night_ratio: 2.0       # daytime mean must exceed night mean by this factor
  channel: 'melanopic'           # primary channel for per-day pages + compliance
  day_window: [7, 19]            # daytime hours for adequacy metrics
  night_window: [23, 6]          # night hours (wraps midnight) for adequacy metrics
  tat_threshold_lx: 250.0        # daytime "bright enough" floor (time-above-threshold)
  tbt_threshold_lx: 10.0         # night "dark enough" ceiling (time-below-threshold)

# OneDrive Files On-Demand hydration behaviour.
onedrive:
  poll_interval_seconds: 1.0
  stall_timeout_seconds: 30.0    # force-read the file if download stalls this long
  total_timeout_seconds: 3600.0  # give up after this long waiting for a download

runs_dir: 'runs'
